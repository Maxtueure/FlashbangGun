name: Build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Restore EXILED
        run: nuget restore packages.config -PackagesDirectory packages
      - name: Get game references
        shell: pwsh
        run: |
          choco install steamcmd -y
          $dir = "$env:RUNNER_TEMP\slserver"
          steamcmd +force_install_dir $dir +login anonymous +app_update 996560 validate +quit
          steamcmd +force_install_dir $dir +login anonymous +app_update 996560 validate +quit
          if (-not (Test-Path "$dir\SCPSL_Data\Managed\Assembly-CSharp.dll")) { throw "Game files not found" }
          exit 0
      - name: Fix project paths
        shell: pwsh
        run: |
          $managed = "$env:RUNNER_TEMP\slserver\SCPSL_Data\Managed"
          $p = Get-Content Flashbang45.csproj -Raw
          $p = $p.Replace('..\..\..\..\..\..\Program Files (x86)\Steam\steamapps\common\SCP Secret Laboratory Dedicated Server\SCPSL_Data\Managed', $managed)
          $p = $p.Replace('..\packages\', 'packages\')
          $p = $p.Replace('Include="Flashbang45.cs"', 'Include="FlashbangGun.cs"')
          Set-Content Flashbang45.csproj $p
      - run: msbuild Flashbang45.csproj /p:Configuration=Release
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: bin/Release/Flashbang45.dll
